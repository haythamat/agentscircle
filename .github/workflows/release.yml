# Builds signed installers and publishes them to GitHub Releases when you push a version tag:
#   git tag v1.0.0 && git push origin v1.0.0        -> stable release
#   git tag v1.1.0-beta.1 && git push origin v1.1.0-beta.1   -> beta (pre-release)
# Or, without pushing a tag: GitHub → Actions → Release → Run workflow, and enter the version.
# Installed apps find the new version automatically. See RELEASING.md for the one-time setup.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (e.g. 1.3.0, or 1.4.0-beta.1 for a beta)'
        required: true
      publish:
        description: 'Publish the release when the builds finish (leave off to keep it as a draft you check first)'
        type: boolean
        default: false

env:
  # The release tag: from the pushed tag, or "v" + the version typed in Run workflow.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The version in the tag wins, and releases are tied to this repository.
      - name: Set version and repository
        shell: bash
        run: |
          VERSION="${TAG#v}"
          npm pkg set version="$VERSION"
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}"
      - name: Build and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (skipped if the secrets aren't set)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || runner.os == 'Windows' && secrets.WIN_CERT_PFX_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || runner.os == 'Windows' && secrets.WIN_CERT_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ] && [ "$RUNNER_OS" = "macOS" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
          fi
          [ -z "$CSC_LINK" ] && export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --publish always

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      # electron-builder uploads to a draft; publish it once every platform is done.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$TAG" == *-* ]]; then PRE="--prerelease"; else PRE="--latest"; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA" $PRE
